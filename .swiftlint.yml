# SwiftLint 0.65.0 is required. See reference/SwiftLint.md.

disabled_rules:
  # swift-format is the sole owner of whitespace and layout.
  - colon
  - comma
  - function_name_whitespace
  - leading_whitespace
  - line_length # handled by swift-format
  - opening_brace # handled by swift-format
  - statement_position # handled by swift-format
  - switch_case_on_newline # handled by swift-format
  - trailing_comma # handled by swift-format
  - trailing_newline # handled by swift-format
  - trailing_whitespace # handled by swift-format
  - vertical_whitespace # handled by swift-format

  # Project policy: these rules either reject intentional API/test shapes or
  # impose size preferences that are reviewed structurally instead.
  - file_length # files should be short, but a universal line cap is not useful
  - for_where # nested control flow is sometimes clearer at the use site
  - function_body_length # complexity is gated separately below
  - function_parameter_count # Codable and fixture signatures can be inherently wide
  - implicit_optional_initialization # explicit `= nil` is clearer at state boundaries
  - large_tuple # tuple width is reviewed at the declaration
  - todo # TODO/FIXME policy is exposed through the dedicated blocking recipe
  - type_body_length # disagree
  - unneeded_synthesized_initializer # dubious when you need inlinability

  # Codable implementations deliberately catch and propagate/wrap arbitrary
  # user-thrown errors; requiring a downcast would misstate that contract.
  - untyped_error_in_catch

opt_in_rules:
  - array_init # Array(seq) instead of seq.map { $0 }
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  # - explicit_acl # strongly preferred
  # - explicit_top_level_acl # strongly preferred
  - explicit_init
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - reduce_into
  - redundant_nil_coalescing
  - static_operator
  - yoda_condition
  - unowned_variable_capture
  - unneeded_parentheses_in_closure_argument
  - unhandled_throwing_task
  - toggle_bool
  - sorted_first_last
  - shorthand_optional_binding
  - shorthand_argument
  - self_binding
  - return_value_from_void_function

excluded:
  - .build
  - .swiftpm
  - .github
  - .vscode

identifier_name:
  max_length: 60
  excluded:
    - N # fixed-size InlineArray generic value parameter
    - id
    - op
    - i
    - j
    - a
    - b
  allowed_symbols: ["_"]

type_name:
  min_length: 4
  max_length: 60
  excluded:
    - ID
    - Key
  allowed_symbols: ["_"]

# Keep a meaningful complexity gate without rejecting small exhaustive
# representation switches. SwiftLint's defaults (10/20) flag reviewed
# functions with 11–16 branches.
cyclomatic_complexity:
  warning: 20
  error: 30
