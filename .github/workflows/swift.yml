name: Supported Configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supported-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Supported tests (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Build in debug with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test in debug with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build in release
        run: swift build --configuration release -Xswiftc -warnings-as-errors

      - name: Test in release
        run: swift test --configuration release -Xswiftc -warnings-as-errors

      - name: Verify the external public API boundary
        run: bash Scripts/verify-public-api.sh

      - name: Run the release benchmark smoke test
        run: |
          swift run --configuration release XPCCodingBenchmarks self-test
          swift run \
            --configuration release \
            --skip-build \
            XPCCodingBenchmarks run \
            --smoke \
            --output .build/benchmarks/ci-smoke.json

      - name: Upload the benchmark smoke report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-smoke-xcode-26.6
          path: .build/benchmarks/ci-smoke.json
          if-no-files-found: error
          retention-days: 14

  xpc-process-boundary:
    name: Same-host XPC request/reply (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the real same-host XPC process-boundary fixture
        run: bash Scripts/run-xpc-integration.sh

  address-sanitizer:
    name: Address Sanitizer (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the complete suite under AddressSanitizer
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          swift test \
            --sanitize=address \
            -Xswiftc -warnings-as-errors \
            2>&1 | tee "${RUNNER_TEMP}/address-sanitizer.log"

      - name: Run subprocess-isolated hostile-input regressions
        run: |
          set -o pipefail
          swift test \
            --scratch-path "${RUNNER_TEMP}/address-subprocess-tests" \
            -Xswiftc -warnings-as-errors \
            --filter \
            'UnalignedNumericDecodingTests|DecoderResourceLimitTests|ReferencingEncoderStateTests|UnsafePointerCountValidationTests' \
            2>&1 | tee -a "${RUNNER_TEMP}/address-sanitizer.log"

      - name: Upload the complete AddressSanitizer log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: address-sanitizer-xcode-26.6
          path: ${{ runner.temp }}/address-sanitizer.log
          if-no-files-found: error
          retention-days: 14

  undefined-behavior-sanitizer:
    name: Undefined Behavior Sanitizer (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the complete suite under UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          swift test \
            --sanitize=undefined \
            -Xswiftc -warnings-as-errors \
            2>&1 | tee "${RUNNER_TEMP}/undefined-behavior-sanitizer.log"

      - name: Upload the complete UndefinedBehaviorSanitizer log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: undefined-behavior-sanitizer-xcode-26.6
          path: ${{ runner.temp }}/undefined-behavior-sanitizer.log
          if-no-files-found: error
          retention-days: 14

  thread-sanitizer:
    name: Thread Sanitizer (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the complete suite under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          swift test \
            --sanitize=thread \
            -Xswiftc -warnings-as-errors \
            2>&1 | tee "${RUNNER_TEMP}/thread-sanitizer.log"

      - name: Run subprocess-isolated hostile-input regressions
        run: |
          set -o pipefail
          swift test \
            --scratch-path "${RUNNER_TEMP}/thread-subprocess-tests" \
            -Xswiftc -warnings-as-errors \
            --filter \
            'UnalignedNumericDecodingTests|DecoderResourceLimitTests|ReferencingEncoderStateTests|UnsafePointerCountValidationTests' \
            2>&1 | tee -a "${RUNNER_TEMP}/thread-sanitizer.log"

      - name: Upload the complete ThreadSanitizer log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thread-sanitizer-xcode-26.6
          path: ${{ runner.temp }}/thread-sanitizer.log
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Compile macOS 26 (arm64)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Compile for macOS 26
        run: |
          swift build \
            --configuration release \
            --triple arm64-apple-macosx26.0 \
            --scratch-path "${RUNNER_TEMP}/macos-build" \
            -Xswiftc -warnings-as-errors

  ios:
    name: Compile iOS 26 (arm64)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Compile for iOS 26
        run: |
          xcodebuild \
            -scheme XPCCoding \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

  catalyst:
    name: Compile Mac Catalyst 26 (arm64)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Compile for Mac Catalyst 26
        run: |
          xcodebuild \
            -scheme XPCCoding \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTS_MACCATALYST=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build
