name: Supported Configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supported-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Supported tests (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Verify reviewed inlining annotations
        run: bash Scripts/verify-inlining-annotations.sh

      - name: Build in debug with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Prove the zero-known-issue gate rejects what it claims to reject
        run: bash Scripts/run-tests-with-zero-known-issues.sh self-test

      - name: Test in debug, requiring zero known issues
        run: |
          set -o pipefail
          bash Scripts/run-tests-with-zero-known-issues.sh debug \
            2>&1 | tee "${RUNNER_TEMP}/tests-debug.log"

      - name: Build in release
        run: swift build --configuration release -Xswiftc -warnings-as-errors

      - name: Test in release, requiring zero known issues
        run: |
          set -o pipefail
          bash Scripts/run-tests-with-zero-known-issues.sh release \
            2>&1 | tee "${RUNNER_TEMP}/tests-release.log"

      - name: Upload the zero-known-issue test transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-known-issue-tests-xcode-26.6
          path: |
            ${{ runner.temp }}/tests-debug.log
            ${{ runner.temp }}/tests-release.log
          if-no-files-found: error
          retention-days: 14

      - name: Verify the external public API boundary
        run: bash Scripts/verify-public-api.sh

      - name: Run the release benchmark smoke test
        run: |
          swift run --configuration release XPCCodingBenchmarks self-test
          swift run \
            --configuration release \
            --skip-build \
            XPCCodingBenchmarks run \
            --smoke \
            --output .build/benchmarks/ci-smoke.json

      - name: Upload the benchmark smoke report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-smoke-xcode-26.6
          path: .build/benchmarks/ci-smoke.json
          if-no-files-found: error
          retention-days: 14

  formatting:
    name: Strict formatting (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the canonical strict swift-format check
        run: bash Scripts/check-swift-format.sh

  quality-contracts:
    name: Strict SwiftLint and recipe contracts (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Install checksum-verified quality tools
        run: |
          bash Scripts/install-ci-quality-tools.sh "${RUNNER_TEMP}/quality-tools"
          printf '%s\n' "${RUNNER_TEMP}/quality-tools" >>"${GITHUB_PATH}"

      - name: Run canonical strict SwiftLint
        run: |
          set -o pipefail
          just lint check-all github-actions-logging \
            2>&1 | tee "${RUNNER_TEMP}/swiftlint.log"

      - name: Verify aggregate recipe dependency contracts
        run: |
          set -o pipefail
          bash Scripts/verify-just-recipe-contracts.sh \
            2>&1 | tee "${RUNNER_TEMP}/recipe-contracts.log"

      - name: Verify Swift Package Index metadata
        run: |
          set -o pipefail
          bash Scripts/verify-swift-package-index-metadata.sh \
            2>&1 | tee "${RUNNER_TEMP}/spi-metadata.log"

      - name: Upload quality-gate transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-contracts-xcode-26.6
          path: |
            ${{ runner.temp }}/swiftlint.log
            ${{ runner.temp }}/recipe-contracts.log
            ${{ runner.temp }}/spi-metadata.log
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: API documentation (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Generate the XPCCoding documentation, gating public-doc completeness and DocC warnings
        run: |
          set -o pipefail
          bash Scripts/generate-api-documentation.sh "${RUNNER_TEMP}/documentation" \
            2>&1 | tee "${RUNNER_TEMP}/documentation.log"
          tar \
            -czf "${RUNNER_TEMP}/XPCCoding.doccarchive.tar.gz" \
            -C "${RUNNER_TEMP}/documentation" \
            XPCCoding.doccarchive

      - name: Upload the documentation archive and transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-documentation-xcode-26.6
          path: |
            ${{ runner.temp }}/documentation.log
            ${{ runner.temp }}/XPCCoding.doccarchive.tar.gz
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Source coverage (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Generate and enforce source coverage
        run: bash Scripts/generate-source-coverage.sh "${RUNNER_TEMP}/coverage"

      - name: Upload the raw report, summary, and complete transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-coverage-xcode-26.6
          path: ${{ runner.temp }}/coverage
          if-no-files-found: warn
          retention-days: 14

  xpc-process-boundary:
    name: Same-host XPC request/reply (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the real same-host XPC process-boundary fixture
        run: bash Scripts/run-xpc-integration.sh

  baseline-evidence:
    name: Regression-first baseline evidence (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          # The pinned audit revision has to be resolvable from the object
          # database, which the default shallow fetch does not provide.
          fetch-depth: 0

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Prove the audited defects reproduce at 813c52e and not in this tree
        run: |
          set -o pipefail
          bash Scripts/run-baseline-evidence.sh \
            2>&1 | tee "${RUNNER_TEMP}/baseline-evidence.log"

      - name: Upload the baseline evidence transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-evidence-xcode-26.6
          path: ${{ runner.temp }}/baseline-evidence.log
          if-no-files-found: error
          retention-days: 14

  api-stability:
    name: Source API stability (Xcode 26.6)
    runs-on: macos-26
    # The digester builds twice from a cold cache (pinned baseline checkout plus
    # the working tree), so this gets the same budget as the multi-build jobs.
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
          # The pinned API baseline revision has to be resolvable from the
          # object database, which the default shallow fetch does not provide.
          fetch-depth: 0

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Diff the public API against the pinned hardened baseline
        run: bash Scripts/verify-api-stability.sh

  fuzzing-smoke:
    name: Deterministic fuzzing smoke (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the bounded deterministic fuzzing smoke campaign
        env:
          XPCCODING_FUZZING_ARTIFACTS: ${{ runner.temp }}/fuzzing-smoke
        run: |
          set -o pipefail
          bash Scripts/run-fuzzing-smoke.sh \
            2>&1 | tee "${RUNNER_TEMP}/fuzzing-smoke.log"

      - name: Upload the fuzzing smoke report and any counterexamples
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzing-smoke-xcode-26.6
          path: |
            ${{ runner.temp }}/fuzzing-smoke.log
            ${{ runner.temp }}/fuzzing-smoke
          if-no-files-found: error
          retention-days: 14

  address-sanitizer:
    name: Address Sanitizer (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the complete suite under AddressSanitizer
        run: |
          set -o pipefail
          bash Scripts/run-sanitizer-tests.sh address \
            2>&1 | tee "${RUNNER_TEMP}/address-sanitizer.log"

      - name: Run subprocess-isolated hostile-input regressions
        run: |
          set -o pipefail
          bash Scripts/run-hostile-input-tests.sh \
            2>&1 | tee -a "${RUNNER_TEMP}/address-sanitizer.log"

      - name: Upload the complete AddressSanitizer log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: address-sanitizer-xcode-26.6
          path: ${{ runner.temp }}/address-sanitizer.log
          if-no-files-found: error
          retention-days: 14

  undefined-behavior-sanitizer:
    name: Undefined Behavior Sanitizer (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the complete suite under UndefinedBehaviorSanitizer
        run: |
          set -o pipefail
          bash Scripts/run-sanitizer-tests.sh undefined \
            2>&1 | tee "${RUNNER_TEMP}/undefined-behavior-sanitizer.log"

      - name: Upload the complete UndefinedBehaviorSanitizer log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: undefined-behavior-sanitizer-xcode-26.6
          path: ${{ runner.temp }}/undefined-behavior-sanitizer.log
          if-no-files-found: error
          retention-days: 14

  thread-sanitizer:
    name: Thread Sanitizer (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Run the complete suite under ThreadSanitizer
        run: |
          set -o pipefail
          bash Scripts/run-sanitizer-tests.sh thread \
            2>&1 | tee "${RUNNER_TEMP}/thread-sanitizer.log"

      - name: Run subprocess-isolated hostile-input regressions
        run: |
          set -o pipefail
          bash Scripts/run-hostile-input-tests.sh \
            2>&1 | tee -a "${RUNNER_TEMP}/thread-sanitizer.log"

      - name: Upload the complete ThreadSanitizer log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thread-sanitizer-xcode-26.6
          path: ${{ runner.temp }}/thread-sanitizer.log
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Compile macOS 26 (arm64)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Compile for macOS 26
        run: |
          swift build \
            --configuration release \
            --triple arm64-apple-macosx26.0 \
            --scratch-path "${RUNNER_TEMP}/macos-build" \
            -Xswiftc -warnings-as-errors

  ios:
    name: Compile iOS 26 (arm64)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Compile for iOS 26
        run: |
          xcodebuild \
            -scheme XPCCoding \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

  catalyst:
    name: Compile Mac Catalyst 26 (arm64)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Verify the supported toolchain and manifest
        run: bash Scripts/verify-support-policy.sh

      - name: Compile for Mac Catalyst 26
        run: |
          xcodebuild \
            -scheme XPCCoding \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTS_MACCATALYST=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build
