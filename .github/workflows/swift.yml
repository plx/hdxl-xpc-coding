name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-26]
        xcode: ['26.6']

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode ${{ matrix.xcode }}
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    - name: Verify supported toolchain and manifest
      run: bash Scripts/verify-support-policy.sh

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-xcode-${{ matrix.xcode }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-xcode-${{ matrix.xcode }}-spm-

    - name: Build
      run: swift build -q

    - name: Run tests
      run: swift test -q

    - name: Run release benchmark smoke test
      run: |
        swift run -c release XPCCodingBenchmarks self-test
        swift run -c release --skip-build XPCCodingBenchmarks run \
          --smoke \
          --output .build/benchmarks/ci-smoke.json

    - name: Upload benchmark smoke report
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-smoke-${{ matrix.os }}-xcode-${{ matrix.xcode }}
        path: .build/benchmarks/ci-smoke.json
