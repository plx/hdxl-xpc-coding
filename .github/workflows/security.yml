name: Security Controls

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  whole-history-secret-scan:
    name: Whole-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Gitleaks binary
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" \
            | sha256sum --check
          tar \
            --extract \
            --gzip \
            --file "${archive}" \
            --directory "${RUNNER_TEMP}" \
            gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan every reachable commit
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" git \
            --verbose \
            --redact \
            --log-opts=--all \
            "${GITHUB_WORKSPACE}"
